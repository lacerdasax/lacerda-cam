workflows:
  android-only:
    name: Android Simple - 100% Funcional
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
